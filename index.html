<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEXO</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<header class="header">

<div>

<div class="logo">NEXO</div>

<div class="section-subtitle">
O ponto entre a leitura e a decisão.
</div>

</div>

<div class="user">
TRADER
</div>

</header>


<nav class="nav">

<button class="active" onclick="showSection('gamesSection')">
🏟️ JOGOS
</button>

<button onclick="showSection('historySection')">
📊 HISTÓRICO
</button>

<button onclick="showSection('metricsSection')">
📈 MÉTRICAS
</button>

</nav>


<main>

<section id="gamesSection">

<section class="games-section">

<h1 class="section-title">
🔴 LIVE
</h1>

<div class="section-subtitle">
Jogos acontecendo agora
</div>

<div id="liveGames" class="games-grid"></div>

</section>


<section class="games-section">

<h1 class="section-title">
⏳ PRÓXIMOS
</h1>

<div class="section-subtitle">
Partidas que ainda não começaram
</div>

<div id="upcomingGames" class="games-grid"></div>

</section>


<section id="selectedGame" class="panel hidden">

</section>

</section>


<section id="historySection" class="hidden">

<h1 class="section-title">
📊 HISTÓRICO
</h1>

<div class="section-subtitle">
Suas decisões registradas pelo NEXO.
</div>

<div id="historyContainer"></div>

</section>


<section id="metricsSection" class="hidden">

<h1 class="section-title">
📈 MÉTRICAS
</h1>

<div class="panel">

<h2 class="section-title">
Em construção
</h2>

<div class="section-subtitle">
O NEXO começará a analisar seus padrões de decisão aqui.
</div>

</div>

</section>

</main>


<footer class="footer">

NEXO — Protótipo V0.5

</footer>

</div>


<script>

function showSection(sectionId) {

  document
    .getElementById("gamesSection")
    .classList.add("hidden");

  document
    .getElementById("historySection")
    .classList.add("hidden");

  document
    .getElementById("metricsSection")
    .classList.add("hidden");

  document
    .getElementById(sectionId)
    .classList.remove("hidden");

}

</script>


<script src="app.js"></script>

</body>

</html>
